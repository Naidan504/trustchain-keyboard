# XcodeGen spec: `xcodegen` in this folder generates TrustChainKeyboard.xcodeproj (not committed).
name: TrustChainKeyboard
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TrustChainKeyboard:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.trustchain.keyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TrustChain Keyboard AppStore CI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrustChain Keyboard
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.trustchain.keyboard.ext
        PRODUCT_NAME: Keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TrustChain Keyboard Ext AppStore CI
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: TrustChain Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mn
            RequestsOpenAccess: false
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TrustChainKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.trustchain.keyboard.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TrustChainKeyboard
schemes:
  TrustChainKeyboard:
    build:
      targets:
        TrustChainKeyboard: all
    test:
      targets:
        - UITests
