name: TestFlight testers

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number to wait for (blank = newest upload)
        required: false

jobs:
  internal:
    name: Add team to internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/asc-internal-testers.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ inputs.build }}
