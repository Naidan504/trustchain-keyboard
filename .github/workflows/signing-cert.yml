name: Create distribution certificate (one-time)

# Creates the long-lived Apple Distribution certificate and hands it back as a password-protected
# p12 artifact (kept 1 day), which the maintainer stores as the DIST_P12_BASE64 / DIST_CERT_ID secrets.
# Run again only if that certificate expires. Never revoke it while TestFlight builds signed by it are in use.
on:
  workflow_dispatch:

jobs:
  cert:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create certificate and p12
        run: |
          set -euo pipefail
          test -n "$P12_PASSWORD" || { echo "DIST_P12_PASSWORD secret missing"; exit 1; }
          umask 077; mkdir -p out
          openssl genrsa -out dist.key 2048 2>/dev/null
          openssl req -new -key dist.key -out dist.csr -subj "/CN=TrustChain Keyboard/O=Trustchain Tuul LLC/C=MN"
          node tools/asc-signing.mjs create-cert dist.csr out
          openssl x509 -inform DER -in out/dist.cer -out dist.pem
          openssl pkcs12 -export -inkey dist.key -in dist.pem -out out/dist.p12 -passout env:P12_PASSWORD \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          rm -f dist.key out/dist.cer
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cert
          path: out/
          retention-days: 1
