name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', 'spec/layout.json', 'tools/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false

jobs:
  build:
    name: Simulator build (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "no Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen
      - run: node tools/sync-spec.mjs
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project TrustChainKeyboard.xcodeproj -scheme TrustChainKeyboard \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
      - name: Screenshot in the simulator
        continue-on-error: true
        working-directory: ios
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7][^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEV"
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/TrustChainKeyboard.app
          xcrun simctl launch "$DEV" mn.trustchain.keyboard
          sleep 8
          xcrun simctl io "$DEV" screenshot setup-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: ios/setup-screen.png
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "no Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen
      - run: node tools/sync-spec.mjs
      - working-directory: ios
        run: xcodegen
      - name: App Store Connect API key file
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$APPLE_TEAM_ID" -a -n "$ASC_KEY_P8" || { echo "Missing secrets"; exit 1; }
          mkdir -p ~/private_keys && printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Temporary distribution certificate + App Store profiles
        run: |
          set -euo pipefail
          S=$RUNNER_TEMP/sign; mkdir -p $S; cd $S
          /usr/bin/openssl genrsa -out dist.key 2048 2>/dev/null
          /usr/bin/openssl req -new -key dist.key -out dist.csr -subj "/CN=TrustChain Keyboard CI/O=Trustchain Tuul LLC/C=MN"
          node $GITHUB_WORKSPACE/tools/asc-signing.mjs setup dist.csr .
          /usr/bin/openssl x509 -inform DER -in dist.cer -out dist.pem
          P=$(/usr/bin/openssl rand -hex 16)
          /usr/bin/openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout pass:$P
          KC=$RUNNER_TEMP/ci.keychain-db; KP=$(/usr/bin/openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          curl -fsSL -o wwdr.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import wwdr.cer -k "$KC" -T /usr/bin/codesign || true
          security import dist.p12 -k "$KC" -P "$P" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<sha1>/'
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp ./*.mobileprovision "$d/"
          done
          rm -f dist.key dist.p12
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project TrustChainKeyboard.xcodeproj -scheme TrustChainKeyboard \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/TrustChainKeyboard.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -n 60
      - name: Export and upload to App Store Connect
        working-directory: ios
        run: |
          set -o pipefail
          sed "s/TEAM_ID_HERE/$APPLE_TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/TrustChainKeyboard.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60
      - name: Clean up (revoke temporary certificate, delete keychain and key file)
        if: always()
        run: |
          [ -f $RUNNER_TEMP/sign/signing.env ] && node tools/asc-signing.mjs cleanup $RUNNER_TEMP/sign || true
          security delete-keychain $RUNNER_TEMP/ci.keychain-db 2>/dev/null || true
          rm -rf ~/private_keys $RUNNER_TEMP/sign
