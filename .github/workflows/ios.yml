name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', 'spec/layout.json', 'tools/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false

jobs:
  build:
    name: Simulator build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: node tools/sync-spec.mjs
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project TrustChainKeyboard.xcodeproj -scheme TrustChainKeyboard \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 80
      - name: Screenshot in the simulator
        continue-on-error: true
        working-directory: ios
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7][^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEV"
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/TrustChainKeyboard.app
          xcrun simctl launch "$DEV" mn.trustchain.keyboard
          sleep 8
          xcrun simctl io "$DEV" screenshot setup-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: ios/setup-screen.png
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: node tools/sync-spec.mjs
      - working-directory: ios
        run: xcodegen
      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$APPLE_TEAM_ID" -a -n "$ASC_KEY_P8" || { echo "Missing secrets: ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID, ASC_KEY_P8"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Archive (signed by Xcode cloud signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project TrustChainKeyboard.xcodeproj -scheme TrustChainKeyboard \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/TrustChainKeyboard.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -n 80
      - name: Export and upload to App Store Connect
        working-directory: ios
        run: |
          set -o pipefail
          sed "s/TEAM_ID_HERE/$APPLE_TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/TrustChainKeyboard.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 80
      - if: always()
        run: rm -rf ~/private_keys
